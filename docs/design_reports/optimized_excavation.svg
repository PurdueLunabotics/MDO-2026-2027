<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Moving excavation: front and rear fresh soil layers"><rect width="1200" height="560" rx="14" fill="#f7fafc"/><g font-family="sans-serif" fill="#203249"><text x="30" y="36" font-size="25" font-weight="700">Moving excavation · two fresh layers</text><text x="30" y="65" font-size="17">Side elevation · each circle represents a shaft-linked pair · forward is right</text><rect x="35" y="300" width="1130" height="125" fill="#d8c3a4"/><rect x="35" y="300" width="934.19" height="13.65" fill="#f7fafc"/><rect x="35" y="313.65" width="198.12" height="13.65" fill="#f7fafc"/><path d="M35 327.31 H233.12 V313.65 H969.19 V300 H1165" fill="none" stroke="#816b50" stroke-width="3"/><line x1="35" y1="300" x2="1165" y2="300" stroke="#8b7961" stroke-dasharray="7 5"/><text x="1020" y="290" font-size="15">Original grade</text><line x1="1079.19" y1="300" x2="1079.19" y2="313.65" stroke="#227a80" stroke-width="3"/><line x1="123.12" y1="300" x2="123.12" y2="327.31" stroke="#b36624" stroke-width="3"/><circle cx="969.19" cy="218.65" r="95.00" fill="#227a80" fill-opacity=".12" stroke="#227a80" stroke-width="4"/><circle cx="969.19" cy="218.65" r="5" fill="#227a80"/><text x="969.19" y="84" text-anchor="middle" font-size="18" font-weight="700">Front pair</text><text x="969.19" y="104" text-anchor="middle" font-size="15">Depth 25.0 mm = d</text><circle cx="233.12" cy="232.31" r="95.00" fill="#b36624" fill-opacity=".12" stroke="#b36624" stroke-width="4"/><circle cx="233.12" cy="232.31" r="5" fill="#b36624"/><text x="233.12" y="84" text-anchor="middle" font-size="18" font-weight="700">Rear pair</text><text x="233.12" y="104" text-anchor="middle" font-size="15">Depth 50.0 mm = 2d</text><path d="M470 165 H715 M700 155 L715 165 L700 175" fill="none" stroke="#203249" stroke-width="3"/><text x="590" y="151" text-anchor="middle" font-size="16">Feed 30.30 mm/s</text><text x="600" y="385" text-anchor="middle" font-size="17">Each pair removes one inlet-depth layer: d = 25.0 mm, across the full drum width.</text><text x="600" y="411" text-anchor="middle" font-size="16">The rear pair does not count the front pair’s removed soil again.</text><text x="30" y="452" font-size="16">Both pairs lower together → feed with both pairs cutting → both pairs raise together.</text><text x="30" y="479" font-size="16">Productive lane: 3.475 m · total feed travel: 4.823 m · feed time: 159.4 s</text><text x="30" y="509" font-size="15">The maximum-extension view is a separate plunge/recovery reach screen; it is not this operating pose.</text><text x="30" y="535" font-size="15">Schematic soil boundary; entry/endcap soil is not credited. Soil flow and recovery driving require validation.</text></g></svg>