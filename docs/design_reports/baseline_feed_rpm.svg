<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 650" role="img" aria-label="Drum RPM versus feed speed with no-overfeed boundary"><rect width="1140" height="650" rx="14" fill="#f7fafc"/><g font-family="sans-serif" fill="#203249"><text x="30" y="36" font-size="25" font-weight="700">Feed speed and drum RPM</text><text x="30" y="65" font-size="17">Forward advance per scoop ≤ inlet depth · an uncalibrated feed screen</text><rect x="100" y="100" width="940" height="330" fill="#f5e4df"/><polygon points="100.00,430.00 1040.00,430.00 1040.00,113.75 100.00,430.00" fill="#d9ebe4" data-region="feed-screen-passes"/><line x1="100" y1="100" x2="100" y2="430" stroke="#ffffff" stroke-width="1"/><line x1="100" y1="430" x2="1040" y2="430" stroke="#ffffff" stroke-width="1"/><text x="100" y="456" text-anchor="middle" font-size="15">0</text><text x="85" y="435" text-anchor="end" font-size="15">0</text><line x1="335" y1="100" x2="335" y2="430" stroke="#ffffff" stroke-width="1"/><line x1="100" y1="347.5" x2="1040" y2="347.5" stroke="#ffffff" stroke-width="1"/><text x="335" y="456" text-anchor="middle" font-size="15">34.5</text><text x="85" y="352.5" text-anchor="end" font-size="15">60</text><line x1="570" y1="100" x2="570" y2="430" stroke="#ffffff" stroke-width="1"/><line x1="100" y1="265" x2="1040" y2="265" stroke="#ffffff" stroke-width="1"/><text x="570" y="456" text-anchor="middle" font-size="15">69</text><text x="85" y="270" text-anchor="end" font-size="15">120</text><line x1="805" y1="100" x2="805" y2="430" stroke="#ffffff" stroke-width="1"/><line x1="100" y1="182.5" x2="1040" y2="182.5" stroke="#ffffff" stroke-width="1"/><text x="805" y="456" text-anchor="middle" font-size="15">103.5</text><text x="85" y="187.5" text-anchor="end" font-size="15">180</text><line x1="1040" y1="100" x2="1040" y2="430" stroke="#ffffff" stroke-width="1"/><line x1="100" y1="100" x2="1040" y2="100" stroke="#ffffff" stroke-width="1"/><text x="1040" y="456" text-anchor="middle" font-size="15">138</text><text x="85" y="105" text-anchor="end" font-size="15">240</text><path d="M100 100 V430 H1040" fill="none" stroke="#536579" stroke-width="2"/><line x1="100" y1="430" x2="1040.00" y2="113.75" stroke="#176d71" stroke-width="4" data-limit="inlet_depth*scoops_per_revolution*rpm/60"/><line x1="917.39" y1="430" x2="917.39" y2="155.00" stroke="#176d71" stroke-dasharray="5 4"/><circle cx="917.39" cy="155.00" r="7" fill="#176d71" stroke="white" stroke-width="2" data-current-rpm="120" data-current-feed="0.2"/><text x="570" y="484" text-anchor="middle" font-size="17">Drum RPM</text><text x="24" y="270" transform="rotate(-90 24 270)" text-anchor="middle" font-size="17">Feed speed (mm/s)</text><text x="30" y="518" font-size="16">Current: 120.00 rpm, 200.00 mm/s</text><text x="30" y="542" font-size="16">Forward advance: 25.00 mm/scoop · inlet depth: 25.00 mm</text><text x="30" y="572" font-size="16">Maximum feed = inlet_depth × scoops/revolution × RPM / 60; at this RPM: 200.00 mm/s.</text><text x="30" y="600" font-size="15">Green: passes this feed screen. Red: excessive advance per scoop. Motor, reach and traction checks still apply.</text><text x="30" y="627" font-size="15">This volume/bite constraint does not establish measured capture, cutting loads or high-speed soil retention.</text></g></svg>