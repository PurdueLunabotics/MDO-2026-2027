name: Rover model checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --baseline --output results/ci_baseline.json
      - name: Verify optimization from recorded feasible start
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path

          # Match the optimizer regression test; default-start failures remain documented.
          start = json.loads(Path("tests/fixtures/obstacle_feasible_start.json").read_text())["inputs"]
          command = [sys.executable, "main.py", "--check-derivatives",
                     "--output", "results/ci_optimization.json"]
          for name, value in start.items():
              command.extend(["--set", f"{name}={value}"])
          subprocess.run(command, check=True)
