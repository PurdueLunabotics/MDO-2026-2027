name: Rover model checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --baseline --output results/ci_baseline.json
      - name: Verify derivatives and honest optimization status
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path

          # Historical feasible starts predate BWR climbing requirements.
          # A failed design is allowed; a crash or falsely feasible report is not.
          command = [sys.executable, "main.py", "--check-derivatives",
                     "--output", "results/ci_optimization.json"]
          result = subprocess.run(command)
          assert result.returncode in (0, 1), result.returncode
          record = json.loads(Path("results/ci_optimization.json").read_text())
          final = record["final"]
          accepted = record["optimizer_success"] and final["feasible"]
          assert result.returncode == (0 if accepted else 1)
          assert record["status"] == ("converged_feasible" if accepted else "failed_or_infeasible")
          for state in ("empty", "loaded"):
              outputs = final["outputs"]
              valid = outputs[state+"_slope_solution_valid"]["value"] == 1
              slip = outputs[state+"_slope_slip"]["value"]
              assert final["constraints"][state+"_slope_traversal_margin"]["passed"] == (valid and 0 <= slip < 1)
